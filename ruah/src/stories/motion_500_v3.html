<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Cz;font-weight:900;src:url('../../fontes/cinzel900.ttf')}@font-face{font-family:Cz;font-weight:700;src:url('../../fontes/cinzel700.ttf')}
@font-face{font-family:CG;font-style:italic;src:url('../../fontes/cg400i.ttf')}@font-face{font-family:CG;font-weight:500;src:url('../../fontes/cg500n.ttf')}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#080808}
#s{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(900px 900px at 50% 46%,#1a1917,#080808 72%)}
canvas{position:absolute;inset:0}
.abs{position:absolute;left:0;width:100%;text-align:center}
.c{position:absolute;left:50%;transform:translateX(-50%)}
#bone{position:absolute;inset:0;background:radial-gradient(900px 900px at 50% 46%,#F6F3EC,#E3DED3 78%)}
#lab{top:420px;font:500 26px CG;letter-spacing:.42em;text-transform:uppercase;color:#EEEAE1}
#n{top:560px;font:900 470px/1 Cz;color:#EEEAE1}
#h{top:1160px;font:900 70px/1.1 Cz;text-transform:uppercase;letter-spacing:.03em;color:#15120F}
#i{top:1370px;font:italic 46px/1.35 CG;color:#15120F;padding:0 120px}
#ln{top:1530px;left:50%;height:1px;background:#15120F;opacity:.4;transform:translateX(-50%)}
#w{top:1180px;font:500 28px CG;letter-spacing:.5em;text-transform:uppercase;color:#EEEAE1}
#sig{top:1260px;font:italic 36px CG;color:#B8B2A8}
</style></head><body><div id="s">
 <canvas id="cv" width="1080" height="1920"></canvas>
 <img class="c" id="bigsym" src="../../marca/logos/RUAH_simbolo_bone_600dpi.png" style="top:430px;width:760px">
 <img class="c" id="sym" src="../../marca/logos/RUAH_simbolo_bone_600dpi.png" style="top:650px;width:360px">
 <div class="abs" id="lab">Obrigado</div>
 <div class="abs" id="n">0</div>
 <div id="bone"></div>
 <img class="c" id="symB" src="../../marca/logos/RUAH_simbolo_preto_600dpi.png" style="top:330px;width:120px">
 <div class="abs" id="nB" style="top:520px;font:900 470px/1 Cz;color:#15120F">500</div>
 <div class="abs" id="h">500 pessoas<br>carregando junto.</div>
 <div class="abs" id="i">Obrigado por carregar a RUAH com a gente.</div>
 <div id="ln" class="abs" style="width:90px"></div>
 <img class="c" id="logo" src="../../marca/logos/logo-bone.png" style="top:820px;width:640px">
 <div class="abs" id="w">We carry the spirit.</div>
 <div class="abs" id="sig">@ruahwear_</div>
</div><script>
// v3 (12 s) só com o sopro e a logo: sopro nasce no escuro → contagem 0→500 com o sopro ao fundo → virada para o bone com o agradecimento → assinatura com a logo.
const $=id=>document.getElementById(id), cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const cv=$('cv'), g=cv.getContext('2d');
const rnd=k=>{const x=Math.sin(k*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const P=[...Array(90)].map((_,k)=>({x:rnd(k)*1080,y:rnd(k+.5)*1920,r:.8+rnd(k+.2)*2.2,v:12+rnd(k+.7)*30,a:.15+rnd(k+.9)*.45,ph:rnd(k+.3)*6.28}));
function particles(t,alpha){ g.clearRect(0,0,1080,1920); if(alpha<=0) return;
  for(const p of P){ const y=(p.y-p.v*t*2+1920*4)%1920, x=p.x+Math.sin(t*.6+p.ph)*18;
    g.globalAlpha=alpha*p.a*(.6+.4*Math.sin(t*1.3+p.ph)); g.fillStyle='#EEEAE1'; g.beginPath(); g.arc(x,y,p.r,0,6.283); g.fill(); } }
function R(t){
  const toBone=eio(seg(t,5.6,6.3)), toBlack=eio(seg(t,9.2,9.8));
  particles(t,(1-toBone)*eo(seg(t,0,1.2)) + toBlack);
  // 1) o sopro nasce: revela de baixo para cima com brilho
  const rv=eo(seg(t,.2,1.6)), up=eio(seg(t,1.7,2.4));
  const sy=$('sym'); sy.style.clipPath=`inset(${(1-rv)*100}% 0 0 0)`;
  sy.style.opacity=(1-up)*(1-toBone); sy.style.transform=`translateX(-50%) translateY(${-up*260}px) scale(${1-.55*up})`;
  sy.style.filter=`drop-shadow(0 0 ${30+20*Math.sin(t*2)}px rgba(238,234,225,.35))`;
  // 2) sopro gigante ao fundo, respirando, atrás do número
  const bg=eo(seg(t,2.0,3.0))*(1-toBone);
  $('bigsym').style.opacity=.07*bg; $('bigsym').style.transform=`translateX(-50%) rotate(${Math.sin(t*.5)*3}deg) scale(${1+.03*Math.sin(t*.9)})`;
  $('lab').style.opacity=.7*eo(seg(t,1.9,2.6))*(1-toBone); $('lab').style.letterSpacing=(.75-.33*eo(seg(t,1.9,2.9)))+'em';
  const c=eo(seg(t,2.2,5.0)); $('n').textContent=Math.round(500*c);
  $('n').style.opacity=eo(seg(t,2.1,2.5))*(1-toBone);
  $('n').style.transform=`scale(${1.1-.1*eo(seg(t,2.1,3.2))+.05*Math.max(0,1-Math.abs(t-5.05)/.25)})`;
  $('n').style.textShadow=`0 0 ${60*Math.max(0,1-Math.abs(t-5.05)/.6)}px rgba(238,234,225,.45)`;
  // 3) virada para o bone (círculo que abre do centro) + agradecimento
  const b=$('bone'); b.style.clipPath=`circle(${toBone*1400*(1-toBlack)}px at 50% 46%)`;
  const vis=toBone*(1-toBlack);
  $('symB').style.opacity=vis*eo(seg(t,6.1,6.7)); $('nB').style.opacity=vis;
  $('nB').style.transform=`scale(${1+.02*seg(t,6,9)})`;
  const th=eo(seg(t,6.5,7.2)), ti=eo(seg(t,7.5,8.2));
  $('h').style.opacity=th*(1-toBlack); $('h').style.transform=`translateY(${(1-th)*40}px)`;
  $('i').style.opacity=.85*ti*(1-toBlack); $('ln').style.width=(90*ti)+'px'; $('ln').style.opacity=.4*ti*(1-toBlack);
  // 4) assinatura: logo RUAH com o sopro, We carry the spirit.
  const lg=eo(seg(t,9.7,10.6));
  $('logo').style.opacity=lg; $('logo').style.transform=`translateX(-50%) scale(${.94+.06*lg})`; $('logo').style.filter=`blur(${(1-lg)*10}px)`;
  $('w').style.opacity=.8*eo(seg(t,10.4,11.0)); $('w').style.letterSpacing=(.8-.3*eo(seg(t,10.4,11.4)))+'em';
  $('sig').style.opacity=eo(seg(t,10.9,11.4));
}
R(0);
</script></body></html>
