<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- v4 · profundidade: fundo desfocado → texto gigante → pessoa recortada na frente. Pouca informação: título + 1 destaque + arraste. -->
<style>
@font-face{font-family:I;font-weight:400;src:url('../fonts/InterPDF-400.ttf')}
@font-face{font-family:I;font-weight:600;src:url('../fonts/InterPDF-600.ttf')}
@font-face{font-family:I;font-weight:700;src:url('../fonts/InterPDF-700.ttf')}
@font-face{font-family:I;font-weight:800;src:url('../fonts/InterPDF-800.ttf')}
@font-face{font-family:A;src:url('../fonts/Anton.woff2')}
*{margin:0;padding:0;box-sizing:border-box}body{background:#222}
.art{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:I,sans-serif;color:#fff;background:#08090E}
.L{position:absolute;inset:0;background-repeat:no-repeat}
.bg{filter:blur(28px) brightness(.5) saturate(.9);background-size:cover;background-position:center;inset:-60px}
.pp{position:absolute;z-index:5;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.top{position:absolute;left:70px;right:70px;top:60px;display:flex;justify-content:space-between;align-items:center;font:600 28px I;z-index:9}
.top .c{display:flex;align-items:center;gap:14px}.top .c i{width:50px;height:50px;border-radius:50%;background:#2F6BFF;display:grid;place-items:center;font-style:normal;font-size:24px}
.top .n{padding:10px 18px;border-radius:99px;background:rgba(0,0,0,.35);font-size:24px}
.big{position:absolute;left:0;right:0;text-align:center;font-family:A;text-transform:uppercase;line-height:.85;color:#fff;z-index:3}
.pre{position:absolute;left:0;right:0;text-align:center;font:400 64px I;letter-spacing:-.04em;z-index:3}
.pre b{font-weight:800}
.blk{position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);background:#2F6BFF;padding:14px 34px;font:800 64px I;letter-spacing:-.04em;white-space:nowrap;z-index:8;box-shadow:0 20px 40px rgba(0,0,0,.35)}
.swipe{position:absolute;right:70px;bottom:60px;padding:16px 30px;border-radius:99px;background:rgba(255,255,255,.95);color:#2F6BFF;font:700 28px I;z-index:9}
.shade{position:absolute;left:0;right:0;bottom:0;height:420px;background:linear-gradient(180deg,rgba(8,9,14,0),rgba(8,9,14,.75));z-index:7}
</style></head><body>

<!-- D1 · mulher: "MARGEM" atrás da cabeça -->
<section class="art" data-out="entregas/testes/v4_profundidade/D1_margem.png">
  <div class="L bg" style="background-image:url('../img/ph_mulher.jpg')"></div>
  <div class="top"><div class="c"><i>↗</i>@augustosilva.p</div><div class="n">1/7</div></div>
  <div class="pre" style="top:170px">Você sabe a sua</div>
  <div class="big" style="top:280px;font-size:255px">MARGEM?</div>
  <img class="pp" src="../img/cut_mulher_c.png" style="top:400px;left:-48px;height:980px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%);mask-image:linear-gradient(180deg,transparent 0,#000 16%)">
  <div class="shade"></div>
  <div class="blk" style="top:1060px">ou vende no chute?</div>
  <div class="swipe">arraste pro lado →</div>
</section>

<!-- D2 · estoque: "ESTOQUE" atrás do homem -->
<section class="art" data-out="entregas/testes/v4_profundidade/D2_estoque.png">
  <div class="L bg" style="background-image:url('../img/f4705.jpg')"></div>
  <div class="top"><div class="c"><i>↗</i>@augustosilva.p</div><div class="n">1/7</div></div>
  <div class="pre" style="top:170px">Seu dinheiro está</div>
  <div class="big" style="top:260px;font-size:330px">PARADO</div>
  <img class="pp" src="../img/cut_4705_c.png" style="top:400px;left:130px;height:980px">
  <div class="shade"></div>
  <div class="blk" style="top:1060px">no seu estoque.</div>
  <div class="swipe">arraste pro lado →</div>
</section>

<!-- D3 · apresentação: "LUCRO" atrás -->
<section class="art" data-out="entregas/testes/v4_profundidade/D3_lucro.png">
  <div class="L bg" style="background-image:url('../img/ph_apresenta.jpg')"></div>
  <div class="top"><div class="c"><i>↗</i>@augustosilva.p</div><div class="n">1/8</div></div>
  <div class="pre" style="top:170px"><b>5 custos</b> que comem o seu</div>
  <div class="big" style="top:260px;font-size:400px">LUCRO</div>
  <img class="pp" src="../img/cut_apresenta_c.png" style="top:330px;left:150px;height:1040px">
  <div class="shade"></div>
  <div class="blk" style="top:1060px">e ninguém te conta.</div>
  <div class="swipe">arraste pro lado →</div>
</section>
</body></html>
