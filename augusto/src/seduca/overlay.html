<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IN;font-weight:800;src:url('../fonts/InterPDF-800.ttf')}@font-face{font-family:MR;font-weight:600;src:url('../fonts/Manrope-600.ttf')}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
#chip{position:absolute;left:50%;top:150px;transform:translateX(-50%);padding:16px 34px;border-radius:999px;background:rgba(5,11,31,.82);border:3px solid #2F6BFF;
 box-shadow:0 0 34px rgba(47,107,255,.55);font:800 44px IN;color:#fff;letter-spacing:.02em;white-space:nowrap}
#chip b{color:#5B8CFF;margin-right:14px}
#cap{position:absolute;left:50px;right:50px;top:1330px;text-align:center;font:800 78px/1.08 IN;color:#fff;paint-order:stroke fill;-webkit-text-stroke:14px #050B1F;text-shadow:0 8px 0 #050B1F}
#cap .k{color:#fff;background:#2F6BFF;-webkit-text-stroke:0;text-shadow:none;padding:0 14px;border-radius:12px;box-shadow:0 6px 0 #050B1F}
#end{position:absolute;inset:0;background:rgba(5,11,31,.86);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px}
#end .p{padding:26px 54px;border-radius:999px;background:#2F6BFF;font:800 64px IN;color:#fff;box-shadow:0 0 50px rgba(47,107,255,.7)}
#end .s{font:600 46px MR;color:#9DBBFF}
#hand{position:absolute;bottom:60px;width:100%;text-align:center;font:600 36px MR;color:#fff;opacity:.9;text-shadow:0 3px 10px #000}
</style></head><body>
<div id="chip"></div><div id="cap"></div>
<div id="end"><div class="p">Salve 🔖 e envie ↗</div><div class="s">para quem acha que não consegue</div></div>
<div id="hand">@augustosilva.p</div>
<script>
const CAPS=__CAPS__, CHIPS=__CHIPS__, END=__END__;
function R(t){
 const ch=CHIPS.find(c=>t>=c[0]&&t<c[1]), ce=document.getElementById('chip');
 if(ch&&ch[2]){ce.style.display='block';ce.innerHTML=ch[2];const p=Math.min(1,(t-ch[0])/.18);ce.style.opacity=p;ce.style.transform=`translateX(-50%) translateY(${(1-p)*-30}px)`}else ce.style.display='none';
 const c=CAPS.find(c=>t>=c[0]&&t<c[1]), el=document.getElementById('cap');
 if(!c||t>=END){el.innerHTML='';}else{let k=c[3].findIndex((s,i)=>t>=s&&(i==c[3].length-1||t<c[3][i+1]));if(k<0)k=0;
  el.innerHTML=c[2].map((w,i)=>i==k?`<span class="k">${w}</span>`:w).join(' ');const p=Math.min(1,(t-c[0])/.08);el.style.transform=`scale(${.92+.08*p})`}
 const e=Math.min(1,Math.max(0,(t-END)/.3));document.getElementById('end').style.opacity=e;document.getElementById('hand').style.opacity=.9;
}
R(0);
</script></body></html>
