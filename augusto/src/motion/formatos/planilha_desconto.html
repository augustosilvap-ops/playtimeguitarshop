<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!-- FORMATO "PLANILHA AO VIVO": cursor preenche células, a fórmula aparece na barra e o resultado muda de vermelho para verde. Exemplo hipotético. -->
</head><body><div id="v"></div><script>const THEME={};</script><script src="../lib.js"></script><script>
// células: [linha, rótulo, valor, t de digitação, fórmula]
const STEPS=[
 [0,'Preço','R$ 83,90',0.6,''],[1,'Custo','R$ 48,50',1.4,''],[2,'Taxas','27%',2.2,''],[3,'Desconto','30%',3.0,''],
 [4,'Preço com desconto','R$ 58,73',4.2,'=B1*(1-B4)'],[5,'Lucro por venda','− R$ 5,63',5.6,'=B5-B5*B3-B2'],
];
const FIX=[[3,'15%',8.6],[4,'R$ 71,32',9.4],[5,'R$ 3,56',10.2]];
const cellXY=(r,c)=>({x:100+(c?440:0),y:560+r*120});
window.R=function(t){
 const val={};STEPS.forEach(([r,l,v,t0])=>{if(t>=t0){const n=Math.floor((t-t0)*28);val[r]=v.slice(0,Math.min(v.length,n))}});
 FIX.forEach(([r,v,t0])=>{if(t>=t0)val[r]=v});
 // cursor: vai até a célula ativa
 const acts=[...STEPS.map(s=>[s[0],s[3]]),...FIX.map(f=>[f[0],f[2]])].sort((a,b)=>a[1]-b[1]);
 let i=acts.findIndex(a=>a[1]>t);i=i<0?acts.length-1:Math.max(0,i-1);const cur=acts[i],nxt=acts[Math.min(acts.length-1,i+1)];
 const p=eio(cl((t-cur[1])/.5));const A=cellXY(cur[0],1),B=t<cur[1]?A:A;const cx=A.x+300,cy=A.y+70;
 const formula=(FIX.find(f=>f[2]<=t&&t<f[2]+.8)?'':'')||(t>=STEPS[5][3]&&t<8.4?'=B5-B5*B3-B2':t>=STEPS[4][3]&&t<STEPS[5][3]?'=B1*(1-B4)':t>=8.6?'=1-(48,50/0,68)/83,90 → 15%':'');
 const neg=t>=STEPS[5][3]&&t<FIX[2][2], pos=t>=FIX[2][2];
 let rows='';for(let r=0;r<6;r++){const s=STEPS[r],c=cellXY(r,0),hi=cur[0]===r;const isRes=r===5;
  const col=isRes?(pos?'#22A06B':neg?'#E5384A':'#0A0B10'):'#0A0B10',bg=isRes&&(neg||pos)?(pos?'#E9F7EF':'#FDECEC'):'#fff';
  const flash=isRes&&(Math.abs(t-STEPS[5][3]-.4)<.25||Math.abs(t-FIX[2][2]-.3)<.25)?'transform:scale(1.04)':'';
  rows+=`<div class="ab" style="left:${c.x}px;top:${c.y}px;width:440px;height:120px;border:2px solid #E3E7EF;background:#FAFBFD;font:600 36px I;color:#3B3F4C;display:flex;align-items:center;padding:0 26px">${s[1]}</div>
  <div class="ab" style="left:${c.x+440}px;top:${c.y}px;width:420px;height:120px;border:${hi?'4px solid #2F6BFF':'2px solid #E3E7EF'};background:${bg};font:800 44px I;color:${col};display:flex;align-items:center;justify-content:flex-end;padding:0 26px;${flash}">${val[r]||''}</div>`}
 const cap=t<4?'Coloque os números do produto':t<7.5?'Com 30% off, a venda dá prejuízo':t<10.8?'Agora com o desconto máximo':'15% de desconto ainda dá lucro ✓';
 document.getElementById('v').innerHTML=`<div class="ab" style="inset:0;background:#E9EDF5"></div>
 <div class="ab" style="left:0;right:0;top:140px;text-align:center"><div style="font:800 92px/1 I;letter-spacing:-.05em;color:#0A0B10">A planilha</div><div style="font:800 92px/1 I;letter-spacing:-.05em;color:#2F6BFF">não mente.</div></div>
 <div class="ab" style="left:80px;top:400px;width:920px;height:1000px;background:#fff;border-radius:30px;box-shadow:0 40px 90px rgba(10,20,60,.18);overflow:hidden">
  <div style="height:60px;background:#1C47C9;display:flex;align-items:center;gap:14px;padding:0 24px">${['#FF6B78','#FFC94D','#22C55E'].map(c=>`<i style="width:18px;height:18px;border-radius:50%;background:${c};display:block"></i>`).join('')}<span style="font:600 24px I;color:#fff;margin-left:14px">precificacao.xlsx</span></div>
  <div style="height:80px;border-bottom:2px solid #E3E7EF;display:flex;align-items:center;gap:20px;padding:0 24px;font:500 32px M;color:#3B3F4C"><b style="font:700 28px I;color:#9AA0AE">fx</b>${formula}</div>
 </div>
 <div class="ab" style="left:0;top:0">${rows}</div>
 <svg class="ab" style="left:${cx}px;top:${cy}px" width="60" height="70" viewBox="0 0 24 28"><path d="M2 2 L2 22 L8 17 L12 26 L15 25 L11 16 L19 16 Z" fill="#0A0B10" stroke="#fff" stroke-width="1.5"/></svg>
 <div class="ab" style="left:70px;right:70px;bottom:250px;text-align:center;font:700 44px/1.3 I;color:#fff;background:#0A0B10;border-radius:26px;padding:24px 30px">${cap}</div>
 <div class="ab" style="left:0;right:0;bottom:170px;text-align:center;font:600 28px I;color:#7A7F8C">Exemplo hipotético · @augustosilva.p</div>`};
R(0);
</script></body></html>
