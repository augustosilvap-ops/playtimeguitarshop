<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!-- FORMATO "CONVERSA DE DM": a mini-aula acontece como um chat no celular. Números = exemplo hipotético. -->
</head><body><div id="v"></div><script>const THEME={};</script><script src="../lib.js"></script><script>
const MSG=[ // [t, lado(0=seguidor,1=@augustosilva.p), html]
 [0.4,0,'Vou dar 30% off em tudo na Black 🔥'],
 [1.6,1,'Calma. Faz essa conta comigo antes 👇'],
 [3.0,1,'Preço R$ 83,90 · custo R$ 48,50 · taxas 27%'],
 [4.6,1,'Com 30% off o preço vira <b>R$ 58,73</b>'],
 [6.0,1,'card:prej'],
 [7.8,0,'Eita 😳 então qual o máximo?'],
 [9.2,1,'Divide o custo por (1 − 27% − 5% de margem):<br><b>48,50 ÷ 0,68 = R$ 71,32</b>'],
 [11.0,1,'card:max'],
 [13.0,0,'Salvando essa conversa 🔖'],
];
const card=k=>k==='prej'?`<div style="background:#FDECEC;border-radius:26px;padding:26px 30px"><div style="font:600 26px I;color:#9A3A44">Lucro por venda com 30% off</div><div style="font:800 76px I;color:#E5384A;letter-spacing:-.03em">− R$ 5,63</div></div>`:
 `<div style="background:#E9F7EF;border-radius:26px;padding:26px 30px"><div style="font:600 26px I;color:#1E6B47">Desconto máximo</div><div style="font:800 96px I;color:#22A06B;letter-spacing:-.03em">15%</div><div style="font:600 24px I;color:#1E6B47">ainda sobram R$ 3,56 por venda</div></div>`;
window.R=function(t){
 let y=0,h='';const vis=MSG.filter(m=>m[0]<=t);
 for(const [t0,s,txt] of vis){const q=eo((t-t0)/.35),isCard=txt.startsWith('card:');
  const body=isCard?card(txt.slice(5)):txt, me=s===1;
  h+=`<div style="display:flex;justify-content:${me?'flex-start':'flex-end'};margin:0 0 22px;opacity:${q};transform:translateY(${(1-q)*40}px) scale(${.92+.08*q});transform-origin:${me?'0':'100%'} 100%">
   ${me?`<div style="width:64px;height:64px;border-radius:50%;background:#2F6BFF;color:#fff;display:grid;place-items:center;font:800 30px I;margin:auto 14px 0 0;flex:none">↗</div>`:''}
   <div style="max-width:640px;${isCard?'padding:10px;background:#fff':'padding:24px 30px;background:'+(me?'#F1F3F8':'#2F6BFF')};color:${me?'#0A0B10':'#fff'};border-radius:${me?'34px 34px 34px 10px':'34px 34px 10px 34px'};font:500 38px/1.35 I;box-shadow:0 6px 18px rgba(10,20,60,.08)">${body}</div></div>`}
 const typing=MSG.find(m=>m[0]>t&&m[0]-t<.9);const dots=typing?`<div style="display:flex;justify-content:${typing[1]?'flex-start':'flex-end'};margin-left:${typing[1]?78:0}px"><div style="padding:22px 30px;border-radius:30px;background:${typing[1]?'#F1F3F8':'#2F6BFF'}">${[0,1,2].map(i=>`<span style="display:inline-block;width:14px;height:14px;border-radius:50%;margin:0 5px;background:${typing[1]?'#9AA0AE':'#fff'};opacity:${.35+.65*Math.abs(Math.sin(t*6+i))}"></span>`).join('')}</div></div>`:'';
 const content=h+dots, n=vis.length, scroll=Math.max(0,(n-6))*150;
 const zoom=1+.03*Math.sin(t*.4);
 document.getElementById('v').innerHTML=`<div class="ab" style="inset:0;background:radial-gradient(900px 1200px at 50% 30%,#3D7BFF,#1A3FB0 55%,#08122E)"></div>
 <div class="ab" style="left:0;right:0;top:120px;text-align:center;font:800 64px I;color:#fff;letter-spacing:-.04em;opacity:${eo(t/.5)}">Vai dar 30% off na Black?</div>
 <div class="ab" style="left:110px;top:250px;width:860px;height:1560px;border-radius:70px;background:#fff;box-shadow:0 60px 120px rgba(0,0,0,.45);overflow:hidden;transform:scale(${zoom})">
  <div style="height:150px;border-bottom:2px solid #EEF1F7;display:flex;align-items:center;gap:20px;padding:40px 40px 0"><div style="width:76px;height:76px;border-radius:50%;background:#2F6BFF;color:#fff;display:grid;place-items:center;font:800 34px I">↗</div><div><div style="font:700 34px I;color:#0A0B10">augustosilva.p</div><div style="font:500 24px I;color:#22A06B">online</div></div></div>
  <div style="position:absolute;left:34px;right:34px;top:190px;bottom:120px;overflow:hidden"><div style="transform:translateY(${-scroll}px);transition:none">${content}</div></div>
  <div style="position:absolute;left:30px;right:30px;bottom:26px;height:80px;border-radius:40px;background:#F1F3F8;display:flex;align-items:center;padding:0 30px;font:500 30px I;color:#9AA0AE">Mensagem…</div>
 </div>
 <div class="ab" style="left:0;right:0;bottom:60px;text-align:center;font:600 30px I;color:rgba(255,255,255,.75)">Exemplo hipotético · @augustosilva.p</div>`};
R(0);
</script></body></html>
