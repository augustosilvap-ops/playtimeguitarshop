<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- Formato "Cinético" (identidade @augustosilva.p): tipografia em tela cheia no ritmo da fala, cortes rápidos navy/branco/azul, UI da marca contando a história. -->
<style>
@font-face{font-family:I;font-weight:600;src:url('../fonts/InterPDF-600.ttf')}
@font-face{font-family:I;font-weight:700;src:url('../fonts/InterPDF-700.ttf')}
@font-face{font-family:I;font-weight:800;src:url('../fonts/InterPDF-800.ttf')}
@font-face{font-family:M;font-weight:500;src:url('../fonts/JetBrainsMono-500.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:I,sans-serif}
#v{position:absolute;inset:0;overflow:hidden}
.w{position:absolute;white-space:nowrap;font-weight:800;letter-spacing:-.06em;line-height:.92}
.chip{position:absolute;left:84px;top:150px;display:flex;align-items:center;gap:16px;font:700 30px I;letter-spacing:-.01em}
.chip i{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:28px}
.cap{position:absolute;left:84px;right:84px;bottom:250px;text-align:center;font:700 40px I;letter-spacing:-.01em}
.card{position:absolute;left:140px;right:140px;border-radius:36px;background:#fff;box-shadow:0 30px 70px rgba(10,20,60,.18);padding:40px 48px}
.bar{position:absolute;left:84px;bottom:110px;height:6px;border-radius:6px}
</style></head><body><div id="v"></div>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),eo=x=>1-Math.pow(1-cl(x),3),eb=x=>{x=cl(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const TEMA={"dark": "#0A1430", "light": "#EEF2FA", "accent": "linear-gradient(160deg,#5B8CFF,#1C47C9)", "anim": "mask", "trans": "zoom", "deco": "dots", "align": "center"};
const NAVY='#08090E',WHITE='#F5F7FB',BLUE='#2F6BFF',BLUE2='#7FA3FF',RED='#E5384A',INK='#0A0B10';
// palavra: entra de baixo com escala e desfoque; sai cortada na troca de cena
function w(t,t0,txt,x,y,size,c,o={}){if(t<t0)return'';const p=cl((t-t0)/.2),q=eo(p),s=(o.s||1.35)-((o.s||1.35)-1)*eb(p);let tr,ex='';
 switch(TEMA.anim){case'left':tr=`translateX(${(1-q)*-160}px) skewX(${(1-q)*-14}deg)`;break;
  case'mask':tr=`translateY(${(1-q)*45}%)`;ex=`clip-path:inset(0 0 ${(1-q)*100}% 0);`;break;
  case'zoom':tr=`scale(${1+(1-q)*1.6})`;ex=`filter:blur(${(1-p)*16}px);`;break;
  case'flip':tr=`perspective(900px) rotateX(${(1-q)*-95}deg)`;break;
  default:tr=`translateY(${(1-q)*60}px) scale(${s})`;ex=`filter:blur(${(1-p)*12}px);`}
 const pos=TEMA.align==='center'?`left:0;right:0;text-align:center;`:TEMA.align==='right'?`right:84px;text-align:right;`:`left:${x}px;`;
 return `<div class="w" style="${pos}top:${y}px;font-size:${size}px;color:${c};transform:${tr};transform-origin:${TEMA.anim==='flip'?'50% 100%':TEMA.align==='center'?'50% 50%':TEMA.align==='right'?'100% 50%':(o.o||'0 50%')};${ex}opacity:${cl(p*3)}">${txt}</div>`}
function stamp(lt,t0,word,y){const q=eo((lt-t0)/.18),sh=lt>t0&&lt<t0+.3?Math.sin(lt*120)*10*(1-(lt-t0)/.3):0;return `<div style="position:absolute;left:0;right:0;top:${y}px;text-align:center;font:800 190px/1 I;letter-spacing:-.06em;color:#fff;transform:translateX(${sh}px)">${word}</div>`+(lt<t0?'':`<div style="position:absolute;left:50%;top:${y-30}px;transform:translateX(-50%) rotate(-12deg) scale(${1+(1-q)*1.8});opacity:${q};border:12px solid #E5384A;color:#E5384A;border-radius:24px;padding:10px 40px;font:800 130px/1 I;letter-spacing:.04em;background:rgba(255,255,255,.08)">NÃO</div>`)}
function split(lt,t0,word,y){const q=eo((lt-t0)/.5),d=lt<t0?0:q*90;const base=`position:absolute;left:0;right:0;top:${y}px;text-align:center;font:800 200px/1 I;letter-spacing:-.06em;color:#fff`;return `<div style="${base};clip-path:inset(0 0 50% 0);transform:translate(${-d*.4}px,${-d}px) rotate(${-q*4}deg)">${word}</div><div style="${base};clip-path:inset(50% 0 0 0);transform:translate(${d*.4}px,${d}px) rotate(${q*4}deg)">${word}</div>`+(lt<t0?'':`<div style="position:absolute;left:-40px;right:-40px;top:${y+100}px;height:6px;background:#E5384A;transform:scaleX(${cl((lt-t0)/.15)});opacity:${1-q*.6}"></div>`)}
function strike(lt,t0,word,y){const q=eo((lt-t0)/.25),sh=lt>t0&&lt<t0+.35?Math.sin(lt*110)*12*(1-(lt-t0)/.35):0;return `<div style="position:absolute;left:84px;top:${y}px;font:800 200px/1 I;letter-spacing:-.06em;color:#fff;transform:translateX(${sh}px)">${word}<div style="position:absolute;left:-20px;top:46%;height:22px;width:calc(100% + 40px);background:#E5384A;transform-origin:0 50%;transform:scaleX(${lt<t0?0:q}) rotate(-4deg)"></div></div>`}

const brl=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// vidro: trinca e estilhaça
function glass(lt,tc,tb,x,y,W,H,inner,imp=[.55,.48]){
 const slab=`<div style="position:absolute;inset:0;border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.10) 55%,rgba(255,255,255,.22));border:3px solid rgba(255,255,255,.75);box-shadow:inset 0 2px 0 rgba(255,255,255,.8)">${inner}</div>`;
 const ix=imp[0]*W,iy=imp[1]*H,R=rng(7),N=16,P=[];
 for(let i=0;i<N;i++){const a=(i+R()*.6)/N*2*Math.PI,dx=Math.cos(a),dy=Math.sin(a);let k=1e9;if(dx>0)k=Math.min(k,(W-ix)/dx);if(dx<0)k=Math.min(k,-ix/dx);if(dy>0)k=Math.min(k,(H-iy)/dy);if(dy<0)k=Math.min(k,-iy/dy);P.push([ix+dx*k,iy+dy*k])}
 if(lt<tb){let cr='';if(lt>tc){const q=eo((lt-tc)/.18);cr=`<svg style="position:absolute;left:0;top:0" width="${W}" height="${H}">${P.map((p,i)=>`<line x1="${ix}" y1="${iy}" x2="${ix+(p[0]-ix)*q*(.5+((i*37)%10)/20)}" y2="${iy+(p[1]-iy)*q*(.5+((i*37)%10)/20)}" stroke="#fff" stroke-width="3" opacity=".9"/>`).join('')}<circle cx="${ix}" cy="${iy}" r="${10*q}" fill="#fff"/></svg>`}
  const sh=lt>tc?(Math.sin(lt*90)*4*(1-cl((lt-tc)/.3))):0;
  return `<div style="position:absolute;left:${x+sh}px;top:${y}px;width:${W}px;height:${H}px">${slab}${cr}</div>`}
 const q=cl((lt-tb)/.8);let h='';
 for(let i=0;i<N;i++){const p1=P[i],p2=P[(i+1)%N];for(const part of [0,1]){const f=.42,m1=[ix+(p1[0]-ix)*f,iy+(p1[1]-iy)*f],m2=[ix+(p2[0]-ix)*f,iy+(p2[1]-iy)*f];
  const poly=part?[m1,p1,p2,m2]:[[ix,iy],m1,m2];const cx=poly.reduce((a,p)=>a+p[0],0)/poly.length,cy=poly.reduce((a,p)=>a+p[1],0)/poly.length;
  let dx=cx-ix,dy=cy-iy;const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;const r=rng(i*2+part+3)(),d=(260+r*520)*eo(q);
  h+=`<div style="position:absolute;left:${x}px;top:${y}px;width:${W}px;height:${H}px;clip-path:polygon(${poly.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')});transform-origin:${cx}px ${cy}px;transform:translate(${dx*d}px,${dy*d+1100*q*q}px) rotate(${(r-.5)*160*q}deg);opacity:${1-cl((q-.45)/.5)}">${slab}</div>`}}
 return h+`<div style="position:absolute;inset:0;background:#fff;opacity:${.55*(1-cl((lt-tb)/.12))}"></div>`}
const notif=(lt,t0,y,txt)=>lt<t0?'':`<div style="position:absolute;right:84px;top:${y+(1-eo((lt-t0)/.2))*-40}px;opacity:${cl((lt-t0)/.15)};display:flex;align-items:center;gap:16px;padding:18px 26px;border-radius:24px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);color:#fff;font:700 28px I"><span style="width:40px;height:40px;border-radius:50%;background:#22A06B;display:grid;place-items:center;font-size:22px">✓</span>${txt}</div>`;
function line(lt,t0,x,y,W,H,pts,col,dur=.8){const q=eo((lt-t0)/dur);if(lt<t0)return'';const P=pts.map(([a,b])=>[x+a*W,y+b*H]);let L=0;for(let i=1;i<P.length;i++)L+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);
 const d=P.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' '),e=P[P.length-1],pv=P[P.length-2],ang=Math.atan2(e[1]-pv[1],e[0]-pv[0])*180/Math.PI;
 return `<svg style="position:absolute;left:0;top:0" width="1080" height="1920"><path d="${d}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-q)}"/>${q>.97?`<g transform="translate(${e[0]} ${e[1]}) rotate(${ang})"><path d="M-6 -26 L30 0 L-6 26 Z" fill="${col}"/></g>`:''}</svg>`}
const SC=[
 [0,1.8,NAVY,lt=>notif(lt,.1,300,'Pedido: 200 unidades')+notif(lt,.35,400,'Pago ao fornecedor')+w(lt,0,'COMPROU',84,640,170,'#fff')+w(lt,.25,'ESTOQUE',84,800,220,'#fff')+w(lt,.6,'NO',84,1030,130,'#fff')+w(lt,.8,'ACHISMO?',84,1160,180,BLUE2),'comprou estoque no achismo?'],
 [1.8,3.9,WHITE,lt=>{const p=eo((lt-.1)/.3),sold=Math.round(12*eo((lt-.4)/1.1)),v=200-sold;return `<div class="card" style="top:${380+(1-p)*80}px;opacity:${p}"><div style="font:500 24px M;color:#7A7F8C;letter-spacing:.14em">ESTOQUE PARADO · EXEMPLO</div><div style="font:800 170px/1 I;letter-spacing:-.06em;color:${lt>1.3?RED:INK};margin-top:18px">${sold} <span style="font-size:60px;color:#7A7F8C">vendidas</span></div><div style="font:600 30px I;color:#7A7F8C;margin-top:14px">${v} unidades paradas</div></div>`+line(lt,.45,120,1080,840,420,[[0,.05],[.25,.3],[.45,.25],[.7,.7],[.95,.95]],RED,1.1)+(lt>.6?`<div style="position:absolute;left:120px;top:1040px;font:500 24px M;letter-spacing:.14em;color:${RED};opacity:${cl((lt-.6)/.2)}">VENDAS ↓</div>`:'')},'o estoque fica parado.'],
 [3.9,5.7,BLUE,lt=>w(lt,0,'PARE DE',84,520,150,'#fff')+w(lt,.25,'COMPRAR NO',84,690,140,'#fff')+stamp(lt,.75,'ACHISMO.',1000),'pare de comprar no achismo.'],
 [5.7,7.3,NAVY,lt=>{const p=eo((lt-.3)/.3);return w(lt,0,'USE',84,420,150,'#fff')+w(lt,.2,'DADOS + IA.',84,580,150,BLUE2,{s:1.6})+`<div style="position:absolute;left:84px;right:84px;top:${900+(1-p)*50}px;opacity:${p};padding:34px 40px;border-radius:28px;background:#11131C;border:2px solid #23263A;color:#fff"><div style="font:500 22px M;color:#8C92A3;letter-spacing:.14em">VOCÊ</div><div style="font:600 32px/1.3 I;margin-top:8px">Organize os 10 primeiros anúncios: preço, avaliações e vendas exibidas.</div><div style="font:500 22px M;color:#7FA3FF;letter-spacing:.14em;margin-top:26px;opacity:${cl((lt-.8)/.2)}">IA</div><div style="font:700 32px/1.3 I;margin-top:8px;opacity:${cl((lt-.9)/.2)}">Faixa de preço, brechas e nota de 0 a 10. ✓</div></div>`},'use dados e IA para decidir.'],
 [7.3,9.0,WHITE,lt=>{const items=['Ideias por nicho','Concorrência','Avaliações negativas','Margem viável','Nota de 0 a 10'];return w(lt,0,'5 PROMPTS',84,330,130,INK)+w(lt,.18,'DE GARIMPO',84,470,150,BLUE)+items.map((t,i)=>{const t0=.45+i*.2,q=eo((lt-t0)/.2);return lt<t0?'':`<div style="position:absolute;left:84px;right:84px;top:${720+i*120}px;display:flex;align-items:center;gap:24px;opacity:${q};transform:translateX(${(1-q)*-40}px);font:700 44px I;color:${INK}"><span style="width:70px;height:70px;border-radius:18px;background:${BLUE};color:#fff;display:grid;place-items:center;font-size:40px;flex:none">✓</span>${t}</div>`}).join('')},'5 checagens antes de comprar.'],
 [9.0,10.9,BLUE,lt=>w(lt,0,'COMENTE',84,560,150,'#fff')+w(lt,.25,'GARIMPO',84,750,180,NAVY,{s:1.5})+`<div style="position:absolute;left:84px;top:1060px;padding:34px 64px;border-radius:99px;background:#fff;color:${BLUE};font:800 54px I;letter-spacing:-.02em;opacity:${eo((lt-.6)/.25)};transform:translateY(${(1-eo((lt-.6)/.3))*40-6*Math.abs(Math.sin(Math.PI*cl(lt-.95)/.7))}px)">Leia a legenda ↓</div>`,'e receba os 5 prompts no Direct.']];
const DUR=10.9;
window.R=function(t){
 const i=SC.findIndex(s=>t>=s[0]&&t<s[1]),s=SC[i<0?SC.length-1:i],lt=t-s[0];
 const dark=s[2]===NAVY,blue=s[2]===BLUE,fg=dark||blue?'#fff':INK,bg=dark?TEMA.dark:blue?TEMA.accent:TEMA.light;
 const q=eo(lt/.28);let wrapT=`scale(${1+.02*lt})`,over='';
 if(TEMA.trans==='zoom')wrapT=`scale(${1+.22*(1-q)+.02*lt})`;
 if(TEMA.trans==='slide')wrapT=`translateY(${(1-q)*220}px) scale(${1+.02*lt})`;
 if(TEMA.trans==='flash'&&lt<.3)over=`<div style="position:absolute;inset:0;background:#fff;opacity:${.85*(1-lt/.3)}"></div>`;
 if(TEMA.trans==='wipe'&&lt<.35&&i>0)over=`<div style="position:absolute;top:0;bottom:0;width:1080px;left:${-1080+2160*eo(lt/.35)}px;background:${blue?'#fff':'#2F6BFF'}"></div>`;
 if(TEMA.trans==='cut')wrapT=`scale(${1+(lt<.15?.04*(1-lt/.15):0)+.02*lt})`;
 const ln=dark||blue?'rgba(255,255,255,':'rgba(10,11,16,';let deco='';
 if(TEMA.deco==='grid')deco=`<div style="position:absolute;inset:0;background-image:linear-gradient(${ln}.07) 2px,transparent 2px),linear-gradient(90deg,${ln}.07) 2px,transparent 2px);background-size:90px 90px;background-position:0 ${(t*40)%90}px"></div>`;
 if(TEMA.deco==='dots')deco=`<div style="position:absolute;inset:0;background-image:radial-gradient(${ln}.16) 2.5px,transparent 3px);background-size:44px 44px;background-position:${(t*18)%44}px 0"></div>`;
 if(TEMA.deco==='rings')deco=`<svg style="position:absolute;right:-380px;top:-300px" width="1100" height="1100" viewBox="0 0 1100 1100" fill="none">${[0,1,2,3,4].map(k=>`<circle cx="550" cy="550" r="${180+k*90}" stroke="${ln}${.16-k*.025})" stroke-width="3" stroke-dasharray="${k%2?'14 18':'none'}" transform="rotate(${t*(k%2?20:-12)} 550 550)"/>`).join('')}</svg>`;
 if(TEMA.deco==='scan')deco=`<div style="position:absolute;inset:0;background:repeating-linear-gradient(0deg,${ln}.04) 0 2px,transparent 2px 6px)"></div><div style="position:absolute;left:0;right:0;height:260px;top:${((t*520)%2400)-260}px;background:linear-gradient(180deg,transparent,${ln}.07),transparent)"></div>`;
 document.getElementById('v').innerHTML=`<div style="position:absolute;inset:0;background:${bg}"></div>${deco}
  <div style="position:absolute;inset:0;transform:${wrapT};transform-origin:30% 50%">${s[3](lt)}</div>${over}
  <div class="chip" style="color:${fg}"><i style="background:${blue?'#fff':BLUE};color:${blue?BLUE:'#fff'}">↗</i>@augustosilva.p</div>
  <div class="cap" style="color:${fg};opacity:.9">${s[4]}</div>
  <div class="bar" style="width:912px;background:${dark||blue?'rgba(255,255,255,.2)':'rgba(10,11,16,.12)'}"></div>
  <div class="bar" style="width:${912*t/DUR}px;background:${blue?'#fff':BLUE}"></div>`};
R(0);
</script></body></html>
