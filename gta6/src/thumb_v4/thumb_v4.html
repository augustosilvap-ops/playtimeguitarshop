<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AR;src:url('../../fonts/AR.ttf')}@font-face{font-family:ARN;src:url('../../fonts/ARN.ttf')}
*{margin:0;padding:0;box-sizing:border-box}body{background:#111}
.t{position:relative;width:1080px;height:1920px;overflow:hidden;margin-bottom:20px}
.bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:saturate(1.45) contrast(1.08) brightness(.9) blur(3px)}
.warm{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,60,150,.35) 0%,rgba(255,140,40,.18) 35%,rgba(0,0,0,0) 55%,rgba(10,0,25,.75) 82%,rgba(10,0,25,.95) 100%)}
.sun{position:absolute;left:50%;top:330px;width:900px;height:900px;margin-left:-450px;border-radius:50%;background:radial-gradient(circle,rgba(255,200,90,.55),rgba(255,90,160,.25) 45%,transparent 70%)}
.p{position:absolute;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 96%);filter:drop-shadow(0 30px 40px rgba(0,0,0,.6)) drop-shadow(0 0 3px rgba(255,220,180,.9))}
.ti{position:absolute;left:0;width:100%;text-align:center;transform:rotate(-5deg)}
.l{display:block;position:relative;font-family:AR;line-height:.92;letter-spacing:-.01em;white-space:nowrap}
.l .bk{position:absolute;left:0;right:0;top:0;color:#14051f;-webkit-text-stroke:24px #14051f;filter:drop-shadow(0 14px 0 #14051f) drop-shadow(0 20px 30px rgba(0,0,0,.6))}
.l .fr{position:relative}
.w .fr{color:#fff}
.y .fr{background:linear-gradient(180deg,#fff36b 0%,#ffcf2e 45%,#ff8a1d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.k .fr{background:linear-gradient(180deg,#ff9be0 0%,#ff3fa4 55%,#c21686 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{position:absolute;top:80px;left:60px;padding:10px 28px;border-radius:40px;background:#ff2d95;color:#fff;font:900 52px ARN;box-shadow:0 8px 0 #7a0846}
.hand{position:absolute;bottom:60px;width:100%;text-align:center;font:900 38px ARN;color:#fff;opacity:.9;letter-spacing:.02em;text-shadow:0 3px 8px #000}
svg.arr{position:absolute;filter:drop-shadow(0 8px 0 #14051f) drop-shadow(0 10px 20px rgba(0,0,0,.5))}
</style></head><body>
