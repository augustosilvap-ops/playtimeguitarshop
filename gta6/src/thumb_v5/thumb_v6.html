<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:AR;src:url('../../fonts/AR.ttf')}@font-face{font-family:KN;src:url('../../fonts/Knewave-Regular.ttf')}@font-face{font-family:ARN;src:url('../../fonts/ARN.ttf')}
*{margin:0;padding:0;box-sizing:border-box}body{background:#111}
.t{position:relative;width:1080px;height:1920px;overflow:hidden;margin-bottom:20px}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.3) contrast(1.06)}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,8,60,.45) 0%,rgba(40,8,60,0) 22%,rgba(40,8,60,0) 52%,rgba(30,6,50,.78) 74%,rgba(20,4,36,.96) 100%)}
.gta{position:absolute;top:60px;right:50px;width:330px;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
.badge{position:absolute;top:60px;left:50px;width:200px;filter:drop-shadow(0 0 18px rgba(255,45,149,.7))}
.tt{position:absolute;left:0;width:100%;text-align:center}
.a{display:block;font:900 150px/1 AR;color:#fff;paint-order:stroke fill;-webkit-text-stroke:22px #0d0418;transform:rotate(-4deg);filter:drop-shadow(0 12px 0 #0d0418) drop-shadow(0 18px 28px rgba(0,0,0,.6));white-space:nowrap}
.b{display:block;font:260px/1 KN;color:#ff2d95;paint-order:stroke fill;-webkit-text-stroke:24px #0d0418;transform:rotate(-4deg);margin-top:-10px;filter:drop-shadow(0 12px 0 #0d0418) drop-shadow(0 0 40px rgba(255,45,149,.55));white-space:nowrap}
.c{display:block;font:900 92px/1 AR;color:#fff;paint-order:stroke fill;-webkit-text-stroke:16px #0d0418;transform:rotate(-4deg);margin-top:4px;white-space:nowrap}
svg.sw{position:absolute;left:50%;transform:translateX(-50%) rotate(-4deg)}
svg.arr{position:absolute;filter:drop-shadow(0 8px 0 #0d0418) drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.hand{position:absolute;bottom:56px;width:100%;text-align:center;font:900 40px ARN;color:#fff;letter-spacing:.04em;text-shadow:0 3px 10px #000}
</style></head><body>
<template id="sw"><svg class="sw" width="820" height="80" viewBox="0 0 820 80"><path d="M10 58 C 220 20, 520 8, 810 22 C 600 26, 330 44, 40 76 Z" fill="#2ee6ff" stroke="#0d0418" stroke-width="7"/></svg></template>

<div class="t" id="c1"><div class="bg" style="background-image:url('art/Jason_Lucia_Lock_And_Load_portrait.jpg')"></div><div class="shade"></div>
 <img class="badge" src="CaosInsano_logo_circular.png"><img class="gta" src="GTA_VI_logo_oficial.png">
 <svg class="arr" style="left:700px;top:620px" width="280" height="280" viewBox="0 0 300 300"><path d="M260 40 C 120 30, 60 120, 90 230" stroke="#ff2b2b" stroke-width="36" fill="none" stroke-linecap="round"/><path d="M30 190 L90 265 L160 200" stroke="#ff2b2b" stroke-width="36" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
 <div class="tt" style="top:1250px"><span class="a">OS BUGS</span><span class="b">INSANOS</span><span class="c">DO GTA 6</span></div><div class="swh" style="top:1745px"></div>
 <div class="hand">@caosinsano.br</div></div>

<div class="t" id="c2"><div class="bg" style="background-image:url('art/Cal_Hampton_portrait.jpg')"></div><div class="shade"></div>
 <img class="badge" src="CaosInsano_logo_circular.png"><img class="gta" src="GTA_VI_logo_oficial.png">
 <div class="tt" style="top:1250px"><span class="a">O APÊ DO</span><span class="b">DEXTER</span><span class="c">TÁ NO GTA 6?!</span></div><div class="swh" style="top:1745px"></div>
 <div class="hand">@caosinsano.br</div></div>

<div class="t" id="c3"><div class="bg" style="background-image:url('art/Jason_and_Lucia_02_portrait.jpg')"></div><div class="shade"></div>
 <img class="badge" src="CaosInsano_logo_circular.png"><img class="gta" src="GTA_VI_logo_oficial.png">
 <div class="tt" style="top:1250px"><span class="a">MUDA ISSO</span><span class="b">AGORA!</span><span class="c">3 CONFIGURAÇÕES</span></div><div class="swh" style="top:1745px"></div>
 <div class="hand">@caosinsano.br</div></div>

<div class="t" id="c4"><div class="bg" style="background-image:url('art/Boobie_Ike_portrait.jpg')"></div><div class="shade"></div>
 <img class="badge" src="CaosInsano_logo_circular.png"><img class="gta" src="GTA_VI_logo_oficial.png">
 <div class="tt" style="top:1250px"><span class="a">NUNCA ANDE</span><span class="b">COM GRANA</span><span class="c">NO GTA 6</span></div><div class="swh" style="top:1745px"></div>
 <div class="hand">@caosinsano.br</div></div>
<script>
const sw=document.getElementById('sw').innerHTML;
document.querySelectorAll('.swh').forEach(e=>{e.style.position='absolute';e.style.left='0';e.style.width='100%';e.innerHTML=sw;});
document.fonts.ready.then(()=>document.querySelectorAll('.a,.b,.c').forEach(l=>{const w=l.scrollWidth; if(w>980){l.style.fontSize=(parseFloat(getComputedStyle(l).fontSize)*980/w)+'px'}}));
</script></body></html>
